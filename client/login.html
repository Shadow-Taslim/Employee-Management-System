<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Log In</title>

    <!-- Font Icon -->
    <link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename='fonts/material-icon/css/material-design-iconic-font.min.css') }}">

    <link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename='vendor/nouislider/nouislider.min.css') }}">

    <!-- Main css -->
    <link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="main">
        <div class="container">
            <div class="signup-content">
                <div class="signup-img">
                    <img src="{{ url_for('static', filename='images/pexels-mohan-reddy-atalu-2403785.jpg') }}" alt="Employee management">
                    <div class="signup-img-content">
                        <h2>Log In</h2>
                    </div>
                </div>
                <div class="signup-form">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                        {% endfor %}
                    {% endwith %}
                    <form action="{{ url_for('login') }}" method="POST" class="register-form" id="register-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-row">
                            <div class="form-group">
                                <div class="form-input">
                                    <label for="e_id" class="required">ID Number</label>
                                    <input type="number" name="e_id" id="e_id" min="1" required />
                                </div>
                                <div class="form-input">
                                    <label for="username" class="required">Username</label>
                                    <input type="text" name="username" id="username" autocomplete="username" required />
                                </div>
                                <div class="form-input">
                                    <label for="password" class="required">Password</label>
                                    <input type="password" name="password" id="password" autocomplete="current-password" required />
                                </div>
                                <div class="form-input">
                                    <label for="role" class="required">Role</label>
                                    <select name="role" id="role" required>
                                        <option value="employee">Employee</option>
                                        <option value="admin">Administrator</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-submit">
                            <input type="submit" value="Submit" class="submit" id="submit" name="submit" />
                            <input type="reset" value="Reset" class="submit" id="reset" />
                        </div>
                        <div class="form-input">
                            <a href="{{ url_for('registration') }}" style="float: right;">Not yet registered? Click here.</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/nouislider/nouislider.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/wnumb/wNumb.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jquery-validation/dist/jquery.validate.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/jquery-validation/dist/additional-methods.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
